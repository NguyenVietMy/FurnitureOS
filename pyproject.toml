[project]
name = "furnitureos-room-preview"
version = "0.1.0"
description = "FastAPI authority for the FurnitureOS room preview"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.34,<0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend_tests"]
addopts = "-q"
pythonpath = ["."]

[tool.vercel]
entrypoint = "api.index:app"
